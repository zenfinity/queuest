name = "queuest"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# To enable sharing: create a KV namespace and bind it in the Cloudflare
# Pages dashboard under Settings → Functions → KV namespace bindings,
# using variable name SHARE_KV.
# Local dev: wrangler kv namespace create SHARE_KV --preview
#   then add a [[kv_namespaces]] block with the returned id/preview_id.
