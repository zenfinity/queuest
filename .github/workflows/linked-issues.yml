name: Linked issues

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR description links issues with closing syntax
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // Matches GitHub's own closing-keyword syntax: close/closes/closed,
            // fix/fixes/fixed, resolve/resolves/resolved, directly before #NNN.
            // A prose summary like "Issues Fixed: #123" does NOT match this —
            // that's the exact gap that let PR #146 (v0.5.5) merge without
            // closing 11 completed issues.
            const closesPattern = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\b\s*:?\s*#\d+/i;
            const optOut = /-\s*\[x\]\s*no issues to link/i;

            if (closesPattern.test(body)) {
              console.log('OK — found a valid closing reference (e.g. "Fixes #123").');
              return;
            }
            if (optOut.test(body)) {
              console.log('OK — "No issues to link" is checked.');
              return;
            }

            core.setFailed(
              'No issue-closing reference found in the PR description.\n\n' +
              'GitHub only auto-closes an issue with its literal keyword syntax, e.g. `Fixes #123` ' +
              '— a prose summary like "Issues Fixed: #123" will NOT close anything on merge.\n\n' +
              'Fix: use `Fixes #123` (repeat the keyword per issue for multiple: `Fixes #123, fixes #124`), ' +
              'or check "No issues to link" in the PR template if this PR genuinely closes nothing.'
            );
