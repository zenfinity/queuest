<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Open Graph / messaging app link previews -->
		<meta property="og:type"         content="website" />
		<meta property="og:site_name"    content="Queuest" />
		<meta property="og:title"        content="Queuest" />
		<meta property="og:description"  content="Figure out how long you actually need a streaming subscription — before paying for another month." />
		<meta property="og:image"        content="%sveltekit.env.PUBLIC_ORIGIN%/og-image.png" />
		<meta property="og:image:width"  content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:type"   content="image/png" />
		<!-- Twitter / X card -->
		<meta name="twitter:card"        content="summary_large_image" />
		<meta name="twitter:title"       content="Queuest" />
		<meta name="twitter:description" content="Figure out how long you actually need a streaming subscription — before paying for another month." />
		<meta name="twitter:image"       content="%sveltekit.env.PUBLIC_ORIGIN%/og-image.png" />
		<script>try{if(localStorage.getItem('sq:theme')!=='light')document.documentElement.classList.add('dark')}catch(e){document.documentElement.classList.add('dark')}</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
