<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f97316'/><text x='50' y='50' font-size='70' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='central' font-family='system-ui'>Q</text></svg>"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Queuest" />
		<!-- Open Graph / messaging app link previews. og:title and og:description
		     are NOT here — they're rendered per-route by +layout.svelte from
		     page.data, defaulting the same as before when a route's load doesn't
		     override them, so a route can customize both without producing a
		     second, conflicting copy of either tag (#219). -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Queuest" />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_ORIGIN%/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:type" content="image/png" />
		<!-- Twitter / X card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_ORIGIN%/og-image.png" />
		<script src="%sveltekit.assets%/theme-init.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
